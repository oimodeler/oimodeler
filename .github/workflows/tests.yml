name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.9
        run: uv python pin 3.9

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        working-directory: tests
        run: uv run pytest
